<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>ديلسۆز | Dilsoz College Management</title>

  <!-- Firebase SDK (Compat for easy single-file & live sync) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --card-2: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #ef4444;
      --border: rgba(148, 163, 184, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      background: rgba(17, 24, 39, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--accent);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    select, input, textarea, button {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.92rem;
      outline: none;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--accent);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s ease;
    }

    button.primary {
      background: var(--accent);
      color: #061220;
      border: none;
    }

    button.success {
      background: var(--accent-2);
      color: #051b0d;
      border: none;
    }

    button.danger {
      background: var(--danger);
      color: #fff;
      border: none;
    }

    button:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 1050px;
      margin: 24px auto;
      padding: 0 16px 48px;
      display: grid;
      gap: 20px;
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.9rem;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
    }

    .badge.live {
      background: rgba(34, 197, 94, 0.18);
      color: #4ade80;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h2, .card h3 {
      font-size: 1.08rem;
      color: var(--accent);
    }

    .muted {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .item-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>🎓</span>
      <span id="appTitle">ديلسۆز | Dilsoz</span>
    </div>

    <div class="controls">
      <!-- Language Selector -->
      <select id="langSelect" aria-label="Language">
        <option value="ku">کوردی (بادینی)</option>
        <option value="ar">العربية</option>
        <option value="en">English</option>
      </select>

      <!-- Role Selector -->
      <select id="roleSelect" aria-label="Role">
        <option value="student" id="optStudent">قوتابی (Student)</option>
        <option value="dept_admin" id="optDeptAdmin">ئەدمینێ بەشێ (Department Admin)</option>
        <option value="super_admin" id="optSuperAdmin">سوپەر ئەدمین (Super Admin)</option>
      </select>

      <input type="password" id="pinInput" class="hidden" placeholder="PIN (1234)" style="width: 120px;" />
      <button id="unlockBtn" class="primary hidden">چوونە ژوور</button>
      <button id="logoutBtn" class="hidden">دەرچوون</button>
    </div>
  </header>

  <main class="container">
    <div class="status-bar">
      <div>
        <strong id="activeRoleLabel">دۆخ: قوتابی</strong>
        <span class="muted" id="projectInfo"> — Project: mycollege-b8a6c</span>
      </div>
      <span id="syncStatus" class="badge live">Live Firestore Connected</span>
    </div>

    <!-- Admin Panel (Visible to Super Admin & Department Admin) -->
    <section id="adminPanel" class="grid-2 hidden">
      <div class="card">
        <h2 id="addDeptTitle">زێدەکرنا بەش / وانە</h2>
        <input type="text" id="deptName" placeholder="ناڤێ بەشی یان وانەیێ" />
        <input type="text" id="deptCode" placeholder="کۆد یان قۆناغ (مەسەلەن: Stage 2)" />
        <button id="saveDeptBtn" class="success">تۆمارکرن</button>
      </div>

      <div class="card">
        <h2 id="addAnnTitle">بڵاڤکرنا ئاگادارییەکا نوو</h2>
        <input type="text" id="annTitle" placeholder="سەردێڕێ ئاگادارییێ" />
        <textarea id="annBody" rows="3" placeholder="ناڤەرۆکا ئاگادارییێ..."></textarea>
        <button id="saveAnnBtn" class="primary">بڵاڤکرن</button>
      </div>
    </section>

    <!-- Live Data Display -->
    <section class="grid-2">
      <div class="card">
        <h3 id="deptListTitle">بەش و وانەیێن تۆمارکری</h3>
        <div id="deptList" class="muted">...</div>
      </div>

      <div class="card">
        <h3 id="annListTitle">ئاگاداریێن زیندی</h3>
        <div id="annList" class="muted">...</div>
      </div>
    </section>
  </main>

  <script>
    // 1. Firebase Configuration for mycollege-b8a6c
    // Paste your full copied firebaseConfig keys here if you have custom apiKey/appId/storageBucket
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY_IF_NEEDED",
      authDomain: "mycollege-b8a6c.firebaseapp.com",
      projectId: "mycollege-b8a6c",
      storageBucket: "mycollege-b8a6c.firebasestorage.app",
      messagingSenderId: "1015075976026",
      appId: "PASTE_YOUR_APP_ID_IF_NEEDED"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 2. Trilingual Dictionary (Kurdish Badini, Arabic, English)
    const i18n = {
      ku: {
        dir: "rtl",
        title: "ديلسۆز | سیستەمێ رێڤەبرنا کۆلێژێ",
        student: "قوتابی (Student)",
        deptAdmin: "ئەدمینێ بەشێ (Department Admin)",
        superAdmin: "سوپەر ئەدمین (Super Admin)",
        pinPlaceholder: "کۆدێ PIN (1234)",
        unlock: "چوونە ژوور",
        logout: "دەرچوون",
        statusPrefix: "دۆخێ نووکە:",
        addDept: "زێدەکرنا بەش یان وانەیێ",
        deptNamePh: "ناڤێ بەشی یان وانەیێ",
        deptCodePh: "قۆناغ یان کۆد (وەک: قۆناغا ٢)",
        save: "تۆمارکرن",
        addAnn: "بڵاڤکرنا ئاگادارییەکا نوو",
        annTitlePh: "سەردێڕێ ئاگادارییێ",
        annBodyPh: "ناڤەرۆکا ئاگادارییێ بنڤیسە...",
        publish: "بڵاڤکرن",
        deptList: "بەش و وانەیێن زیندی",
        annList: "ئاگاداریێن کۆلێژێ",
        delete: "ژێبرن",
        wrongPin: "کۆدێ PIN یێ خەڵەتە! (Super Admin PIN: 1234)",
        fillFields: "هیڤیە خانەیان پر بکە.",
        empty: "هیشتا چ داتا نەهاتینە تۆمارکرن."
      },
      ar: {
        dir: "rtl",
        title: "ديلسۆز | نظام إدارة الكلية",
        student: "طالب (Student)",
        deptAdmin: "مسؤول القسم (Department Admin)",
        superAdmin: "المدير العام (Super Admin)",
        pinPlaceholder: "رمز PIN (1234)",
        unlock: "دخول",
        logout: "خروج",
        statusPrefix: "الحالة الحالية:",
        addDept: "إضافة قسم أو مادة",
        deptNamePh: "اسم القسم أو المادة",
        deptCodePh: "المرحلة أو الرمز (مثال: المرحلة الثانية)",
        save: "حفظ",
        addAnn: "نشر إعلان جديد",
        annTitlePh: "عنوان الإعلان",
        annBodyPh: "اكتب نص الإعلان...",
        publish: "نشر",
        deptList: "الأقسام والمواد المباشرة",
        annList: "إعلانات الكلية",
        delete: "حذف",
        wrongPin: "رمز PIN غير صحيح! (Super Admin PIN: 1234)",
        fillFields: "يرجى ملء الحقول المطلوبة.",
        empty: "لا توجد بيانات مسجلة حتى الآن."
      },
      en: {
        dir: "ltr",
        title: "Dilsoz | College Management System",
        student: "Student",
        deptAdmin: "Department Admin",
        superAdmin: "Super Admin",
        pinPlaceholder: "PIN (1234)",
        unlock: "Unlock",
        logout: "Logout",
        statusPrefix: "Active Role:",
        addDept: "Add Department / Course",
        deptNamePh: "Department or Course name",
        deptCodePh: "Stage or Code (e.g. Stage 2)",
        save: "Save",
        addAnn: "Publish Announcement",
        annTitlePh: "Announcement title",
        annBodyPh: "Write announcement details...",
        publish: "Publish",
        deptList: "Live Departments & Courses",
        annList: "College Announcements",
        delete: "Delete",
        wrongPin: "Invalid PIN! (Super Admin PIN: 1234)",
        fillFields: "Please fill in the required fields.",
        empty: "No records found yet."
      }
    };

    let currentLang = "ku";
    let currentRole = "student";
    let isAdminUnlocked = false;

    const langSelect = document.getElementById("langSelect");
    const roleSelect = document.getElementById("roleSelect");
    const pinInput = document.getElementById("pinInput");
    const unlockBtn = document.getElementById("unlockBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const adminPanel = document.getElementById("adminPanel");

    function applyLanguage() {
      const t = i18n[currentLang];
      document.documentElement.lang = currentLang;
      document.documentElement.dir = t.dir;

      document.getElementById("appTitle").textContent = t.title;
      document.getElementById("optStudent").textContent = t.student;
      document.getElementById("optDeptAdmin").textContent = t.deptAdmin;
      document.getElementById("optSuperAdmin").textContent = t.superAdmin;
      pinInput.placeholder = t.pinPlaceholder;
      unlockBtn.textContent = t.unlock;
      logoutBtn.textContent = t.logout;

      document.getElementById("addDeptTitle").textContent = t.addDept;
      document.getElementById("deptName").placeholder = t.deptNamePh;
      document.getElementById("deptCode").placeholder = t.deptCodePh;
      document.getElementById("saveDeptBtn").textContent = t.save;

      document.getElementById("addAnnTitle").textContent = t.addAnn;
      document.getElementById("annTitle").placeholder = t.annTitlePh;
      document.getElementById("annBody").placeholder = t.annBodyPh;
      document.getElementById("saveAnnBtn").textContent = t.publish;

      document.getElementById("deptListTitle").textContent = t.deptList;
      document.getElementById("annListTitle").textContent = t.annList;

      updateRoleUI();
      renderAll();
    }

    function updateRoleUI() {
      const t = i18n[currentLang];
      const roleNames = {
        student: t.student,
        dept_admin: t.deptAdmin,
        super_admin: t.superAdmin
      };

      document.getElementById("activeRoleLabel").textContent = `${t.statusPrefix} ${roleNames[currentRole]}`;

      if (currentRole === "student") {
        isAdminUnlocked = false;
        pinInput.classList.add("hidden");
        unlockBtn.classList.add("hidden");
        logoutBtn.classList.add("hidden");
        adminPanel.classList.add("hidden");
      } else if (!isAdminUnlocked) {
        pinInput.classList.remove("hidden");
        unlockBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
        adminPanel.classList.add("hidden");
      } else {
        pinInput.classList.add("hidden");
        unlockBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
        adminPanel.classList.remove("hidden");
      }
    }

    langSelect.addEventListener("change", (e) => {
      currentLang = e.target.value;
      applyLanguage();
    });

    roleSelect.addEventListener("change", (e) => {
      currentRole = e.target.value;
      if (currentRole === "student") {
        isAdminUnlocked = false;
      }
      updateRoleUI();
    });

    unlockBtn.addEventListener("click", () => {
      const pin = pinInput.value.trim();
      // Super Admin PIN is 1234; Department Admin accepts 1234 or dept2026
      if ((currentRole === "super_admin" && pin === "1234") ||
          (currentRole === "dept_admin" && (pin === "1234" || pin === "2222"))) {
        isAdminUnlocked = true;
        pinInput.value = "";
        updateRoleUI();
        renderAll();
      } else {
        alert(i18n[currentLang].wrongPin);
      }
    });

    logoutBtn.addEventListener("click", () => {
      isAdminUnlocked = false;
      currentRole = "student";
      roleSelect.value = "student";
      updateRoleUI();
      renderAll();
    });

    // 3. Firestore Live Listeners & CRUD
    let cachedDepts = [];
    let cachedAnns = [];

    db.collection("departments").orderBy("createdAt", "desc").onSnapshot((snap) => {
      cachedDepts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderDepts();
    }, (err) => {
      console.error(err);
      document.getElementById("syncStatus").textContent = "Firestore Check Rules";
    });

    db.collection("announcements").orderBy("createdAt", "desc").onSnapshot((snap) => {
      cachedAnns = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderAnns();
    }, (err) => {
      console.error(err);
    });

    document.getElementById("saveDeptBtn").addEventListener("click", async () => {
      if (!isAdminUnlocked) return;
      const name = document.getElementById("deptName").value.trim();
      const code = document.getElementById("deptCode").value.trim();
      if (!name) return alert(i18n[currentLang].fillFields);

      await db.collection("departments").add({
        name,
        code,
        role: currentRole,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      document.getElementById("deptName").value = "";
      document.getElementById("deptCode").value = "";
    });

    document.getElementById("saveAnnBtn").addEventListener("click", async () => {
      if (!isAdminUnlocked) return;
      const title = document.getElementById("annTitle").value.trim();
      const body = document.getElementById("annBody").value.trim();
      if (!title || !body) return alert(i18n[currentLang].fillFields);

      await db.collection("announcements").add({
        title,
        body,
        role: currentRole,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      document.getElementById("annTitle").value = "";
      document.getElementById("annBody").value = "";
    });

    async function deleteDocItem(col, id) {
      if (!isAdminUnlocked) return;
      await db.collection(col).doc(id).delete();
    }

    function renderDepts() {
      const el = document.getElementById("deptList");
      const t = i18n[currentLang];
      if (!cachedDepts.length) {
        el.innerHTML = `<p class="muted">${t.empty}</p>`;
        return;
      }
      el.innerHTML = cachedDepts.map((item) => `
        <div class="item">
          <div>
            <div class="item-title">${escapeHtml(item.name)}</div>
            <div class="muted">${escapeHtml(item.code || "")}</div>
          </div>
          ${isAdminUnlocked ? `<button class="danger" onclick="deleteDocItem('departments', '${item.id}')">${t.delete}</button>` : ""}
        </div>
      `).join("");
    }

    function renderAnns() {
      const el = document.getElementById("annList");
      const t = i18n[currentLang];
      if (!cachedAnns.length) {
        el.innerHTML = `<p class="muted">${t.empty}</p>`;
        return;
      }
      el.innerHTML = cachedAnns.map((item) => `
        <div class="item">
          <div>
            <div class="item-title">${escapeHtml(item.title)}</div>
            <div>${escapeHtml(item.body)}</div>
          </div>
          ${isAdminUnlocked ? `<button class="danger" onclick="deleteDocItem('announcements', '${item.id}')">${t.delete}</button>` : ""}
        </div>
      `).join("");
    }

    function renderAll() {
      renderDepts();
      renderAnns();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Basic PWA Manifest injection via Blob URL so it works as a single file
    const manifestData = {
      name: "Dilsoz College Management | ديلسۆز",
      short_name: "Dilsoz",
      start_url: ".",
      display: "standalone",
      background_color: "#0b1120",
      theme_color: "#0f172a"
    };
    const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: "application/json" });
    const manifestLink = document.createElement("link");
    manifestLink.rel = "manifest";
    manifestLink.href = URL.createObjectURL(manifestBlob);
    document.head.appendChild(manifestLink);

    applyLanguage();
  </script>
</body>
</html>
